<div class="auth-container" dir="ltr" lang="en">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Create account</mat-card-title>
      <mat-card-subtitle>Register to save lessons and history</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onRegister()">
        <mat-form-field appearance="fill" class="full-width" subscriptSizing="dynamic">
          <mat-label>Full name</mat-label>
          <input matInput [(ngModel)]="userData.name" name="name" required autocomplete="name">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width" subscriptSizing="dynamic">
          <mat-label>ID number</mat-label>
          <input matInput [(ngModel)]="userData.id" name="id" required autocomplete="off">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width" subscriptSizing="dynamic">
          <mat-label>Phone</mat-label>
          <input matInput [(ngModel)]="userData.phone" name="phone" required type="tel" autocomplete="tel">
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" class="full-width-submit">
          Register
        </button>
      </form>

      <p class="single-footer">
        Already have an account?
        <a routerLink="/login">Sign in</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
