<div class="history-page" dir="ltr" lang="en">
<mat-toolbar class="history-toolbar">
  <a routerLink="/dashboard" class="brand-link" aria-label="LearnAI home">
    <span class="brand-logo brand-logo-header">Learn<span class="brand-ai">AI</span>.</span>
  </a>
  <span class="toolbar-heading">Lesson history</span>
  <span class="spacer"></span>
  <button mat-button type="button" routerLink="/dashboard">Back to studio</button>
</mat-toolbar>

<div class="history-container">
  <mat-card class="history-card">
    <mat-card-header>
      <mat-card-title>Your lessons</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <mat-spinner *ngIf="isLoading" class="center-spinner"></mat-spinner>

      <table
        mat-table
        [dataSource]="historyData"
        *ngIf="!isLoading && historyData.length > 0"
        class="full-width-table"
      >
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let element">{{ element.created_at | date: 'dd/MM/yyyy HH:mm' }}</td>
        </ng-container>

        <ng-container matColumnDef="subject">
          <th mat-header-cell *matHeaderCellDef>Topic</th>
          <td mat-cell *matCellDef="let element" dir="auto">
            {{ rowTopic(element) }}
          </td>
        </ng-container>

        <ng-container matColumnDef="prompt">
          <th mat-header-cell *matHeaderCellDef>Your request</th>
          <td mat-cell *matCellDef="let element" class="truncate-cell" dir="auto" [title]="rowPrompt(element)">
            {{ rowPrompt(element) }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="viewLesson(element)" type="button" aria-label="View lesson">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <div *ngIf="!isLoading && historyData.length === 0" class="no-data">No lessons yet. Create one from the studio.</div>
    </mat-card-content>
  </mat-card>
</div>
</div>
