<div class="welcome-container" dir="ltr" lang="en">
  <mat-card class="welcome-card">
    <mat-card-header>
      <mat-card-title>
        <span class="brand-logo brand-logo-hero">Learn<span class="brand-ai">AI</span>.</span>
      </mat-card-title>
      <mat-card-subtitle>Structured, AI-assisted lessons — built for clarity</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="buttons-area">
      <div class="learner-actions">
        <button mat-stroked-button class="app-link-button" routerLink="/login" type="button">
          Sign in
        </button>

        <button mat-stroked-button class="app-link-button" routerLink="/register" type="button">
          Create account
        </button>
      </div>

      <div class="admin-access-wrap">
        <button
          mat-flat-button
          class="admin-access-btn btn-accent-gradient"
          routerLink="/login"
          [queryParams]="{ mode: 'admin' }"
          type="button"
        >
          <mat-icon aria-hidden="true">admin_panel_settings</mat-icon>
          Admin Access
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
