<mat-toolbar color="warn" class="flex flex-wrap items-center gap-3 px-4 py-2 shadow-md">
  <span class="font-semibold tracking-tight">לוח מפעילים — ניהול למידה</span>
  <span class="flex-1"></span>
  <button mat-stroked-button routerLink="/dashboard" class="!border-white/80 !text-white">
    <mat-icon>dashboard</mat-icon>
    חזרה לסטודיו
  </button>
</mat-toolbar>

<section class="mx-auto max-w-7xl px-4 py-8 space-y-10 rtl">
  <div class="grid gap-8 lg:grid-cols-2">
    <article class="rounded-2xl border border-slate-200/80 bg-white/90 p-5 shadow-sm backdrop-blur">
      <header class="mb-4 flex items-center justify-between gap-2">
        <h3 class="text-lg font-semibold text-slate-800">משתמשים רשומים</h3>
        <span class="rounded-full bg-amber-100 px-3 py-1 text-xs font-medium text-amber-900">ניהול</span>
      </header>
      <div class="overflow-x-auto rounded-xl border border-slate-100">
        <table mat-table [dataSource]="allUsers" class="min-w-full">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>שם</th>
            <td mat-cell *matCellDef="let user">{{ user.name }}</td>
          </ng-container>
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>טלפון</th>
            <td mat-cell *matCellDef="let user">{{ user.phone }}</td>
          </ng-container>
          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>תפקיד</th>
            <td mat-cell *matCellDef="let user">{{ user.role }}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>פעולות</th>
            <td mat-cell *matCellDef="let user">
              <button mat-button color="primary" (click)="viewHistory(user._id)">צפה בפעילות</button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="userColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: userColumns"></tr>
        </table>
      </div>
      <mat-paginator
        class="!bg-transparent"
        [length]="totalUsers"
        [pageSize]="userPageSize"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onUserPageChange($event)"
      ></mat-paginator>
    </article>

    <article class="rounded-2xl border border-slate-200/80 bg-slate-50/90 p-5 shadow-inner backdrop-blur">
      <header class="mb-4 flex flex-wrap items-center justify-between gap-2">
        <h3 class="text-lg font-semibold text-slate-800">יומן למידה כולל</h3>
        <div class="flex flex-wrap items-center gap-2">
          <span
            *ngIf="scopedLearnerId"
            class="rounded-full bg-amber-50 px-3 py-1 text-xs font-medium text-amber-900 ring-1 ring-amber-200"
            >מסונן למשתמש</span
          >
          <button *ngIf="scopedLearnerId" mat-stroked-button color="primary" type="button" (click)="resetHistoryScope()">
            הצג את כל המשתמשים
          </button>
          <span class="rounded-full bg-indigo-100 px-3 py-1 text-xs font-medium text-indigo-900">אגרגציה</span>
        </div>
      </header>
      <div class="overflow-x-auto rounded-xl border border-slate-100 bg-white">
        <table mat-table [dataSource]="allHistory" class="min-w-full">
          <ng-container matColumnDef="userName">
            <th mat-header-cell *matHeaderCellDef>שם המשתמש</th>
            <td mat-cell *matCellDef="let entry">{{ entry.user_id?.name || 'משתמש לא ידוע' }}</td>
          </ng-container>
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>תאריך</th>
            <td mat-cell *matCellDef="let entry">{{ entry.created_at | date: 'short' }}</td>
          </ng-container>
          <ng-container matColumnDef="prompt">
            <th mat-header-cell *matHeaderCellDef>שאילתה</th>
            <td mat-cell *matCellDef="let entry">{{ entry.prompt }}</td>
          </ng-container>
          <ng-container matColumnDef="view">
            <th mat-header-cell *matHeaderCellDef>פעולה</th>
            <td mat-cell *matCellDef="let entry">
              <button mat-stroked-button color="accent" type="button" (click)="openLessonEntry(entry)">פתח תוכן</button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="historyColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: historyColumns"></tr>
        </table>
      </div>
      <mat-paginator
        class="!bg-transparent"
        [length]="totalHistory"
        [pageSize]="historyPageSize"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onHistoryPageChange($event)"
      ></mat-paginator>
    </article>
  </div>
</section>
