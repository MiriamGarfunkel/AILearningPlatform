services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      MONGO_URI: mongodb://mongo:27017/ai_learning
      PORT: '5000'
      JWT_SECRET: ${JWT_SECRET:-docker-dev-only-change-me}
      JWT_EXPIRE: ${JWT_EXPIRE:-30d}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-auto}
    depends_on:
      - mongo

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  mongo_data:
